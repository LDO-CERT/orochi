{% load allauth %}
<div class="p-3.5 mb-4 text-xs rounded-xl flex items-center gap-2 {% if attrs.level == "error" %}bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-300{% else %}bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/60 text-blue-700 dark:text-blue-300{% endif %}" role="alert">
    {% slot message %}
    {% endslot %}
</div>
