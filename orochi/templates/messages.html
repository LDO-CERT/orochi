{% if messages %}
<div class="mb-5 space-y-2.5">
    {% for message in messages %}
    <div class="flex items-center justify-between p-4 rounded-xl border shadow-sm transition-all
        {% if message.tags == 'error' %}
            bg-rose-50/80 border-rose-200 text-rose-800 dark:bg-rose-950/30 dark:border-rose-900/60 dark:text-rose-200
        {% elif message.tags == 'warning' %}
            bg-amber-50/80 border-amber-200 text-amber-800 dark:bg-amber-950/30 dark:border-amber-900/60 dark:text-amber-200
        {% elif message.tags == 'success' %}
            bg-emerald-50/80 border-emerald-200 text-emerald-800 dark:bg-emerald-950/30 dark:border-emerald-900/60 dark:text-emerald-200
        {% else %}
            bg-blue-50/80 border-blue-200 text-blue-800 dark:bg-blue-950/30 dark:border-blue-900/60 dark:text-blue-200
        {% endif %}" role="alert">
        <div class="flex items-center gap-3">
            <span class="text-base">
                {% if message.tags == 'error' %}
                    <i class="fas fa-circle-xmark"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fas fa-triangle-exclamation"></i>
                {% elif message.tags == 'success' %}
                    <i class="fas fa-circle-check"></i>
                {% else %}
                    <i class="fas fa-circle-info"></i>
                {% endif %}
            </span>
            <div class="text-sm font-medium">{{ message }}</div>
        </div>
        <button type="button" onclick="this.closest('[role=alert]').remove()" class="p-1 rounded-lg text-current opacity-60 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/5 transition-opacity" aria-label="Dismiss">
            <i class="fas fa-times text-xs"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
