{% extends "base.html" %}
{% load static %}

{% block title %}Hex View - {{ name }} - Orochi{% endblock title %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-24">
    <!-- Breadcrumbs / Top Navigation -->
    <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <nav class="flex text-xs font-medium text-zinc-500 dark:text-zinc-400" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1.5 md:space-x-2">
                <li class="inline-flex items-center">
                    <a href="{% url 'website:index' %}" class="inline-flex items-center gap-1.5 text-zinc-600 dark:text-zinc-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                        <i class="fa-solid fa-house"></i>
                        <span>Workbench</span>
                    </a>
                </li>
                <li>
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[10px] text-zinc-400"></i>
                        <span class="font-semibold text-zinc-800 dark:text-zinc-200">{{ name }}</span>
                    </div>
                </li>
                <li aria-current="page">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[10px] text-zinc-400"></i>
                        <span class="font-bold text-blue-600 dark:text-blue-400">Hex View</span>
                    </div>
                </li>
            </ol>
        </nav>
        <div>
            <a href="{% url 'website:index' %}" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-50 dark:hover:bg-zinc-700 transition shadow-2xs">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Workbench</span>
            </a>
        </div>
    </div>

    <!-- Main Card Container -->
    <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200/80 dark:border-zinc-800 shadow-xl overflow-hidden">
        {% include "website/hex_view.html" %}
    </div>
</div>
{% endblock content %}
