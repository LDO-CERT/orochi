<div class="flex items-center justify-between p-4 md:p-5 border-b border-zinc-200 dark:border-zinc-700">
    <h3 class="text-base font-bold text-zinc-900 dark:text-white flex items-center gap-2">
        <i class="fas fa-file-code text-blue-500"></i> Hex View: <span class="font-mono text-zinc-600 dark:text-zinc-300">{{name}}</span>
    </h3>
    <button type="button" class="hex-close text-zinc-400 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-700 dark:hover:text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center transition-colors cursor-pointer">
        <i class="fas fa-times pointer-events-none"></i>
        <span class="sr-only pointer-events-none">Close modal</span>
    </button>
</div>

<div class="p-4 md:p-5 space-y-4">
    <div class="rounded-xl border border-zinc-200 dark:border-zinc-700 overflow-hidden shadow-2xs">
        <table class="w-full text-zinc-800 dark:text-zinc-200" id="hex_example">
            <thead class="bg-zinc-50/80 dark:bg-zinc-800 text-[11px] font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 border-b border-zinc-200 dark:border-zinc-700">
                <tr>
                    <th class="px-4 py-2.5 text-left">Address</th>
                    <th class="px-4 py-2.5 text-left">Hex</th>
                    <th class="px-4 py-2.5 text-left">Ascii</th>
                </tr>
            </thead>
        </table>
    </div>
</div>

<div class="flex items-center justify-end p-4 md:p-5 border-t border-zinc-200 dark:border-zinc-700 gap-2">
    <button type="button" class="hex-close py-2 px-4 text-xs font-medium text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-all shadow-sm cursor-pointer">Close</button>
</div>

<script type="text/javascript">
    (function () {
        var modal = document.getElementById('modal-update');
        var relativeContainer = modal.querySelector('.relative');

        // Widen the modal for Hex View
        if (relativeContainer) {
            relativeContainer.classList.remove('max-w-2xl');
            relativeContainer.classList.add('max-w-7xl');
        }

        // Custom Close button handler to revert width and clean up
        $(modal).off('click', '.hex-close').on('click', '.hex-close', function(e) {
            if (relativeContainer) {
                relativeContainer.classList.remove('max-w-7xl');
                relativeContainer.classList.add('max-w-2xl');
            }
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            window.hex_highlight = null;
        });

        var last = 0;
        window.hex_highlight = null;

        var table = $("#hex_example").DataTable({
            "processing": true,
            "serverSide": true,
            "ajax": "{% url 'website:get_hex' index %}",
            "bSort": false,
            "pageLength": 10,
            "lengthMenu": [10, 25, 50, 100, 250, 500],
            'columnDefs': [
                {
                    'searchable': false,
                    'targets': [0, 1, 2]
                },
            ],
            "sDom": 'l<"goto flex items-center gap-2 mb-4"><"next flex flex-wrap items-center gap-2 mb-4">tip',
            "createdRow": function( row, data, dataIndex ) {
                $(row).addClass('bg-white dark:bg-zinc-800/60 border-b border-zinc-200 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-750 transition-colors');
                $('td', row).addClass('px-4 py-2 font-mono text-xs break-all');

                if (window.hex_highlight) {
                    var h_last = window.hex_highlight.last;
                    var h_len = window.hex_highlight.len;
                    var page_start = window.hex_highlight.page_start;

                    var row_start = page_start + (dataIndex * 16);
                    var row_end = row_start + 16;

                    // Check if highlight overlaps with this row
                    if (h_last < row_end && (h_last + h_len) > row_start) {
                        var start_in_row = Math.max(0, h_last - row_start);
                        var end_in_row = Math.min(16, h_last + h_len - row_start);

                        // Highlight Hex
                        var hex_arr = data[1].split(' ');
                        for (var i = start_in_row; i < end_in_row; i++) {
                            hex_arr[i] = '<span class="bg-amber-400 dark:bg-amber-500 text-zinc-900 font-bold px-1 rounded">' + hex_arr[i] + '</span>';
                        }
                        $('td', row).eq(1).html(hex_arr.join(' '));

                        // Highlight Ascii
                        var tempDiv = document.createElement('div');
                        tempDiv.innerHTML = data[2];
                        for (var i = start_in_row; i < end_in_row; i++) {
                            if (tempDiv.children[i]) {
                                tempDiv.children[i].className = "bg-amber-400 dark:bg-amber-500 text-zinc-900 font-bold px-1 rounded";
                            }
                        }
                        $('td', row).eq(2).html(tempDiv.innerHTML);
                    }
                }
            }
        });

        // GOTO
        $("div.goto").html(`
            <label class="text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-300 flex items-center gap-2 m-0">GoTo:
                <input type="text" class="bg-white dark:bg-zinc-700/60 border border-zinc-300 dark:border-zinc-600 text-zinc-900 dark:text-white text-xs rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-28 p-1.5 font-mono shadow-2xs" id="input_goto" placeholder="0x00">
            </label>
            <button id="btn_goto" class="py-1.5 px-3 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-500/20 rounded-lg shadow-sm transition-all cursor-pointer">Go</button>
        `);
        $(document).off('click', '#btn_goto').on('click', '#btn_goto', function () {
            var page = Math.floor(parseInt($("#input_goto").val(), 16) / (table.page.len() * 16));
            window.hex_highlight = null; // Clear highlight on manual goto
            table.page(page).draw('page');
        });

        // NEXT
        $("div.next").html(`
            <label class="text-xs font-semibold uppercase tracking-wider text-zinc-600 dark:text-zinc-300 flex items-center gap-2 m-0">Search:
                <input type="text" class="bg-white dark:bg-zinc-700/60 border border-zinc-300 dark:border-zinc-600 text-zinc-900 dark:text-white text-xs rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-44 p-1.5 font-mono shadow-2xs" id="input_next" placeholder="pattern...">
            </label>
            <button id="btn_next" class="py-1.5 px-3 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-500/20 rounded-lg shadow-sm transition-all cursor-pointer">Next</button>
            <button id="btn_clear" class="py-1.5 px-3 text-xs font-medium text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-all shadow-sm cursor-pointer">Clear</button>
            <span class="hidden text-rose-500 text-xs font-medium ml-2" id="notfound">Not found!</span>
        `);
        $(document).off('click', '#btn_next').on('click', '#btn_next', function () {
            $("#notfound").addClass('hidden');
            var searchStr = $("#input_next").val();
            if(!searchStr) return;

            $.ajax({
                url: "{% url 'website:search_hex' index %}",
                type: "get",
                data: { 'last': last, 'findstr': searchStr },
                dataType: 'json',
                beforeSend: function () {
                    $("#btn_next").prop("disabled", true).addClass("opacity-50 cursor-not-allowed");
                    $("#btn_clear").prop("disabled", true).addClass("opacity-50 cursor-not-allowed");
                },
                success: function (data) {
                    $("#btn_next").prop("disabled", false).removeClass("opacity-50 cursor-not-allowed");
                    $("#btn_clear").prop("disabled", false).removeClass("opacity-50 cursor-not-allowed");
                    if (data.found == 1) {
                        last = data.pos;
                        var pageLength = table.page.len();
                        var page = Math.floor(last / (pageLength * 16));

                        window.hex_highlight = {
                            last: last,
                            len: searchStr.length,
                            page_start: page * pageLength * 16
                        };

                        table.page(page).draw('page');
                    } else {
                        last = 0;
                        window.hex_highlight = null;
                        $("#notfound").removeClass('hidden');
                        table.draw('page');
                    }
                },
                error: function (error) {
                    $("#btn_next").prop("disabled", false).removeClass("opacity-50 cursor-not-allowed");
                    $("#btn_clear").prop("disabled", false).removeClass("opacity-50 cursor-not-allowed");
                    console.log(error);
                },
            });
        });
        $(document).off('click', '#btn_clear').on('click', '#btn_clear', function () {
            $("#input_next").val('');
            $("#input_goto").val('');
            last = 0;
            window.hex_highlight = null;
            table.page(0).draw('page');
            $("#notfound").addClass('hidden');
        });
    })();
</script>
