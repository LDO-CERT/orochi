{% load custom_tags %}
{% include "website/partial_note.html" %}

{% if bodyfile_chart %}
<div id="accordion-collapse" data-accordion="collapse" class="mt-4 mb-6 mx-2">
  <h2 id="accordion-collapse-heading-1">
    <button type="button" class="flex items-center justify-between w-full p-4 font-medium text-left text-zinc-500 border border-zinc-200 rounded-t-xl focus:ring-4 focus:ring-zinc-200 dark:focus:ring-zinc-800 dark:border-zinc-700 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 gap-3 transition-colors" data-accordion-target="#accordion-collapse-body-1" aria-expanded="true" aria-controls="accordion-collapse-body-1">
      <span class="flex items-center"><i class="fas fa-chart-line mr-2"></i> Bodyfile Chart</span>
      <svg data-accordion-icon class="w-3 h-3 shrink-0 transition-transform rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/>
      </svg>
    </button>
  </h2>
  <div id="accordion-collapse-body-1" aria-labelledby="accordion-collapse-heading-1">
    <div class="p-4 border border-t-0 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 rounded-b-xl overflow-x-auto">
      {{ bodyfile_chart|safe }}
    </div>
  </div>
</div>
{% endif %}

<table id='example' class='w-full text-sm text-left text-zinc-500 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-700'>
    <thead class="text-xs text-zinc-700 uppercase bg-zinc-50 dark:bg-zinc-700 dark:text-zinc-400">
        <tr>
            {% for col in columns %}
            <th scope="col" class="px-6 py-3 {% if maxmind and col|in_list:'LocalAddr,ForeignAddr' %} maxmind {% endif %}">{{col}}</th>
            {% endfor %}
        </tr>
    </thead>
    <tfoot>
        <tr class="text-xs text-zinc-700 uppercase bg-zinc-50 dark:bg-zinc-700 dark:text-zinc-400">
            {% for col in columns %}
            <th scope="col" class="px-6 py-3">{{col}}</th>
            {% endfor %}
        </tr>
    </tfoot>
</table>
