{% load custom_tags %}
{% include "website/partial_note.html" %}

{% if bodyfile_chart %}
<div id="accordion-collapse" data-accordion="collapse" class="mb-6">
  <h2 id="accordion-collapse-heading-1">
    <button type="button" class="flex items-center justify-between w-full p-4 font-semibold text-left text-xs uppercase tracking-wider text-zinc-700 border border-zinc-200 rounded-xl focus:ring-4 focus:ring-blue-500/10 dark:focus:ring-blue-500/20 dark:border-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-700/40 gap-3 transition-colors cursor-pointer bg-white dark:bg-zinc-800" data-accordion-target="#accordion-collapse-body-1" aria-expanded="true" aria-controls="accordion-collapse-body-1">
      <span class="flex items-center gap-2"><i class="fas fa-chart-line text-blue-500"></i> Bodyfile Timeline Chart</span>
      <svg data-accordion-icon class="w-3 h-3 shrink-0 transition-transform rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/>
      </svg>
    </button>
  </h2>
  <div id="accordion-collapse-body-1" aria-labelledby="accordion-collapse-heading-1">
    <div class="p-4 border border-t-0 border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 rounded-b-xl overflow-x-auto">
      {{ bodyfile_chart|safe }}
    </div>
  </div>
</div>
{% endif %}

<div class="overflow-x-auto rounded-xl border border-zinc-200 dark:border-zinc-700 shadow-2xs">
    <table id='example' class='w-full text-xs text-left text-zinc-600 dark:text-zinc-300'>
        <thead class="text-[11px] font-bold text-zinc-700 uppercase tracking-wider bg-zinc-50 dark:bg-zinc-700/60 dark:text-zinc-200 border-b border-zinc-200 dark:border-zinc-700">
            <tr>
                {% for col in columns %}
                <th scope="col" class="px-4 py-3 {% if maxmind and col|in_list:'LocalAddr,ForeignAddr' %} maxmind {% endif %}">{{col}}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody class="divide-y divide-zinc-200 dark:divide-zinc-700/60">
        </tbody>
        <tfoot>
            <tr class="text-[11px] font-bold text-zinc-700 uppercase tracking-wider bg-zinc-50 dark:bg-zinc-700/60 dark:text-zinc-200 border-t border-zinc-200 dark:border-zinc-700">
                {% for col in columns %}
                <th scope="col" class="px-4 py-3">{{col}}</th>
                {% endfor %}
            </tr>
        </tfoot>
    </table>
</div>
