{% extends "base.html" %}
{% load static %}

{% block modal %}
<div id="modal-update" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full bg-zinc-900/50 dark:bg-zinc-900/80 backdrop-blur-sm">
  <div class="relative p-4 w-full max-w-2xl max-h-full modal-dialog mx-auto mt-20">
    <div class="relative bg-zinc-50 border border-zinc-200 dark:bg-zinc-700 dark:border-zinc-600 rounded-xl shadow-xl border border-zinc-300 dark:border-zinc-600 modal-content">
    </div>
  </div>
</div>
{% endblock %}

{% block fullpage %}
<main class="p-4 mx-auto w-full lg:w-4/5">
  <div class="bg-zinc-50 border border-zinc-200 dark:bg-zinc-700 dark:border-zinc-600 border border-zinc-300 dark:border-zinc-600 rounded-xl shadow-lg p-6 min-h-[80vh]">
  {% include "messages.html" %}
  <div class="tab-content">
    <div class="tab-pane fade show active" id="manage_panel" role="tabpanel" aria-labelledby="manage_panel">
      <div class="card">
        <div class="card-header">
          Manage Symbols
          <button type="button" class="text-zinc-900 dark:text-white bg-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-600 focus:ring-4 focus:outline-none focus:ring-zinc-300 dark:focus:ring-zinc-700 font-medium rounded-lg text-sm px-3 py-1.5 text-center transition-colors border border-zinc-400 inline-block" id="upload-symbols">
            <i class="fa fa-upload"></i> Symbols
          </button>
          <button type="button" class="text-zinc-800 dark:text-zinc-200 bg-zinc-50 border border-zinc-200 dark:bg-zinc-700 dark:border-zinc-600 hover:bg-zinc-100 dark:hover:bg-zinc-600 focus:ring-4 focus:outline-none focus:ring-zinc-800 font-medium rounded-lg text-sm px-3 py-1.5 text-center transition-colors border border-zinc-400 dark:border-zinc-500 inline-block" id="upload-packages">
            <i class="fa fa-upload"></i> .deb .ddeb .rmp .exe
          </button>
          <button type="button" class="text-zinc-900 dark:text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-800 font-medium rounded-lg text-sm px-3 py-1.5 text-center transition-colors border border-green-500 inline-block" id="download-isf">
            <i class="fa fa-download"></i> from ISF Server
          </button>
        </div>
        <div class="card-body">
          <table class="table table-striped" id="symbols_list" style="width:100%">
            <thead>
              <tr>
                <th>key</th>
                <th>path</th>
                <th>
                  actions
                  {% csrf_token %}
                </th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  </div>
</main>
{% endblock fullpage %}


{% block javascript %}
{{block.super}}
<script src="{% static 'file_form/file_form.js' %}"></script>
<script type="text/javascript">
  $(document).ready(function () {

    var table = $("#symbols_list").DataTable({
      "processing": true,
      "serverSide": true,
      "ajax": {
        "url": "{% url 'api:list_symbols' %}",
        data: function (d) {
          delete d.columns;
          if (d.order.length > 0) {
            order = d.order[0];
            delete d.order;
            d.order_column = order.column;
            d.order_dir = order.dir;
          } else {
            delete d.order;
          }

          if (d.search && d.search.value) {
            search = d.search.value;
            delete d.search;
            d.search = search;
          } else {
            delete d.search;
          }
          return d;
        }
      },
      'columns': [
        { 'data': 'id' },
        { 'data': 'path' },
        {
          sortable: false,
          render: function (data, type, row, meta) {
            if (row.action[0] == 'down') {
              return `<a class='text-yellow-400 border border-yellow-500 hover:bg-yellow-600 hover:text-zinc-900 dark:hover:text-white focus:ring-4 focus:outline-none focus:ring-yellow-800 font-medium rounded-lg text-sm px-3 py-1.5 text-center transition-colors inline-block' href='${row.action[1]}'><i class='fas fa-download'></i></a>`
            } else if (row.action[0] == 'delete') {
              return `<a class='text-red-400 border border-red-500 hover:bg-red-600 hover:text-zinc-900 dark:hover:text-white focus:ring-4 focus:outline-none focus:ring-red-800 font-medium rounded-lg text-sm px-3 py-1.5 text-center transition-colors inline-block symbol-delete' data-path='${row.action[1]}' href='#'><i class='fas fa-trash'></i></a>`
            }
            return ''
          }
        }
      ],
      'order': [[1, 'asc']]
    });

    // DOWNLOAD FROM ISF FORM
    $(document).on('click', '#download-isf', function () {
      $.ajax({
        url: "{% url 'website:download_isf' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
        }
      });
    });

    // UPLOAD PACKAGE FORM
    $(document).on('click', '#upload-packages', function () {
      $.ajax({
        url: "{% url 'website:upload_packages' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
          $("#btn_package_add").prop('disabled', true);
          $("#btn_symbol_add").prop('disabled', true);
          $("#create_loading").hide();
          initUploadFields(
            document.getElementById("packages-upload-index"),
            {
              callbacks: {
                onSuccess: upload => {
                  $("#btn_package_add").prop('disabled', false);
                }
              }
            }
          );
        }
      });
    });

    // UPLOAD SYMBOLS FORM
    $(document).on('click', '#upload-symbols', function () {
      $.ajax({
        url: "{% url 'website:upload_symbols' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
          $("#btn_symbol_add").prop('disabled', true);
          initUploadFields(
            document.getElementById("symbols-upload-index"),
            {
              callbacks: {
                onSuccess: upload => {
                  $("#btn_symbol_add").prop('disabled', false);
                }
              }
            }
          );
        }
      });
    });

    // UPLOAD SYMBOLS FORM SUBMIT
    $(document).on("submit", "#symbols-upload-index", function (e) {
      e.preventDefault();
      var form = $(this);
      var formData = new FormData(this);
      let jsonData = form.serializeArray();
      let obj = { 'info': [] };
      jsonData.forEach(item => {
        if (['csrfmiddlewaretoken', 'symbols-uploads', 'upload_url', 'form_id', 'symbols-metadata'].indexOf(item.name) == -1) {
          obj[item.name] = item.value;
        } else if (item.name == 'symbols-uploads') {
          obj['info'].push({
            'local_folder': '/media/tmp/' + JSON.parse(item.value)[0]['id'],
            'original_name': JSON.parse(item.value)[0]['name'],
          });
        }
      });
      formData.append("payload", JSON.stringify(obj));
      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });
      $.ajax({
        url: form.attr("action"),
        data: formData,
        type: form.attr("method"),
        processData: false,
        contentType: false,
        dataType: 'json',
        success: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          table.ajax.reload();
          toast({
            title: 'Symbols added!',
            content: 'Symbols added.',
            type: 'success'
          });
        },
        error: function () {
          toast({
            title: 'Error!',
            content: 'Error during symbols upload.',
            type: 'error'
          });
        },
      });
    });

    $(document).on("submit", "#isf-download-index, #packages-upload-index", function (e) {
      e.preventDefault();
      $("#btn_isf_download").html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="sr-only">Loading...</span>');
      $("#btn_isf_download").prop('disabled', true);
      var form = $(this);
      var formData = new FormData(this);
      let jsonData = form.serializeArray();
      let obj = { 'info': [] };
      jsonData.forEach(item => {
        if (['csrfmiddlewaretoken', 'packages-uploads', 'upload_url', 'form_id', 'packages-metadata'].indexOf(item.name) == -1) {
          obj[item.name] = item.value;
        } else if (item.name == 'packages-uploads') {
          obj['info'].push({
            'local_folder': '/media/tmp/' + JSON.parse(item.value)[0]['id'],
            'original_name': JSON.parse(item.value)[0]['name'],
          });
        }
      });
      formData.append("payload", JSON.stringify(obj));
      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });

      $("#create_loading").show();
      $("#btn_package_add").prop('disabled', true);
      $("#btn_symbol_add").prop('disabled', true);
      $.ajax({
        url: form.attr("action"),
        data: formData,
        contentType: "application/json",
        type: form.attr("method"),
        processData: false,
        contentType: false,
        dataType: 'json',
        success: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          table.ajax.reload();
          toast({
            title: 'Symbols added!',
            content: data.message,
            type: 'success'
          });
        },
        error: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          toast({
            title: 'Error!',
            content: data.responseJSON.errors,
            type: 'error'
          });
        },
      });
    });

    // DELETE SYMBOL
    $(document).on("click", ".symbol-delete", function () {
      var btn = $(this);
      var path = btn.data("path");

      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });

      $.ajax({
        url: "{% url 'api:delete_symbol' %}?path=" + encodeURIComponent(path),
        method: 'delete',
        dataType: 'json',
        success: function (data) {
          table.ajax.reload();
          toast({
            title: 'Symbols deleted!',
            content: data.message,
            type: 'success'
          });
        },
        error: function (data) {
          toast({
            title: 'Error!',
            content: data.responseJSON.errors,
            type: 'error'
          });
        },
      });
    });

  });
</script>
{% endblock javascript %}
