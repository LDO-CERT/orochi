{% extends "base.html" %}
{% load static %}

{% block modal %}
<div id="modal-update" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full bg-zinc-900/60 backdrop-blur-sm">
  <div class="relative p-4 w-full max-w-2xl max-h-full modal-dialog mx-auto mt-20">
    <div id="orochi-modal-content" class="relative bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-2xl shadow-2xl modal-content overflow-hidden">
    </div>
  </div>
</div>
{% endblock %}

{% block fullpage %}
<main class="p-4 mx-auto w-full lg:w-4/5">
  <div class="bg-white dark:bg-zinc-800/90 border border-zinc-200/80 dark:border-zinc-700/80 rounded-2xl shadow-sm p-6 min-h-[80vh]">
  {% include "messages.html" %}
  <div class="tab-content">
    <div class="tab-pane fade show active" id="manage_panel" role="tabpanel" aria-labelledby="manage_panel">
      <div>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 mb-5 border-b border-zinc-200 dark:border-zinc-700">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm border border-blue-100 dark:border-blue-900/50 shadow-2xs">
              <i class="fas fa-shapes"></i>
            </div>
            <h2 class="text-xl font-bold text-zinc-900 dark:text-white">
              Manage Symbols
            </h2>
          </div>
          <div class="flex items-center flex-wrap gap-2">
            <button type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-all cursor-pointer" id="upload-symbols">
              <i class="fa fa-upload"></i> Upload Symbols
            </button>
            <button type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-lg text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700 border border-zinc-200 dark:border-zinc-700 shadow-sm transition-all cursor-pointer" id="upload-packages">
              <i class="fa fa-box-archive text-amber-500"></i> Packages (.deb/.rpm/.exe)
            </button>
            <button type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-lg text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700 border border-zinc-200 dark:border-zinc-700 shadow-sm transition-all cursor-pointer" id="download-isf">
              <i class="fa fa-cloud-arrow-down text-blue-500"></i> ISF Server
            </button>
          </div>
        </div>

        <div class="overflow-x-auto rounded-xl border border-zinc-200 dark:border-zinc-700 shadow-2xs">
          <table class="w-full text-xs text-left text-zinc-600 dark:text-zinc-300" id="symbols_list" style="width:100%">
            <thead class="text-[11px] font-bold text-zinc-700 uppercase tracking-wider bg-zinc-50 dark:bg-zinc-700/60 dark:text-zinc-200 border-b border-zinc-200 dark:border-zinc-700">
              <tr>
                <th class="px-4 py-3">Key</th>
                <th class="px-4 py-3">Path</th>
                <th class="px-4 py-3 text-right">
                  Actions
                  {% csrf_token %}
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-zinc-200 dark:divide-zinc-700/60">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  </div>
</main>
{% endblock fullpage %}


{% block javascript %}
{{block.super}}
<script src="{% static 'file_form/file_form.js' %}"></script>
<script type="text/javascript">
  $(document).ready(function () {

    var table = $("#symbols_list").DataTable({
      "processing": true,
      "serverSide": true,
      "ajax": {
        "url": "{% url 'api:list_symbols' %}",
        data: function (d) {
          delete d.columns;
          if (d.order.length > 0) {
            order = d.order[0];
            delete d.order;
            d.order_column = order.column;
            d.order_dir = order.dir;
          } else {
            delete d.order;
          }

          if (d.search && d.search.value) {
            search = d.search.value;
            delete d.search;
            d.search = search;
          } else {
            delete d.search;
          }
          return d;
        }
      },
      'columns': [
        { 'data': 'id' },
        { 'data': 'path' },
        {
          sortable: false,
          className: 'text-right',
          render: function (data, type, row, meta) {
            if (row.action[0] == 'down') {
              return `<a class='inline-flex items-center justify-center p-1.5 text-xs text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 hover:bg-blue-100 rounded-lg border border-blue-200 dark:border-blue-800/60 transition-colors shadow-2xs' href='${row.action[1]}'><i class='fas fa-download'></i></a>`
            } else if (row.action[0] == 'delete') {
              return `<a class='inline-flex items-center justify-center p-1.5 text-xs text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 rounded-lg border border-rose-200 dark:border-rose-900/60 transition-colors shadow-2xs symbol-delete' data-path='${row.action[1]}' href='#'><i class='fas fa-trash'></i></a>`
            }
            return ''
          }
        }
      ],
      'order': [[1, 'asc']]
    });


    // DOWNLOAD FROM ISF FORM
    $(document).on('click', '#download-isf', function () {
      $.ajax({
        url: "{% url 'website:download_isf' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
        }
      });
    });

    // UPLOAD PACKAGE FORM
    $(document).on('click', '#upload-packages', function () {
      $.ajax({
        url: "{% url 'website:upload_packages' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
          $("#btn_package_add").prop('disabled', true);
          $("#btn_symbol_add").prop('disabled', true);
          $("#create_loading").hide();
          initUploadFields(
            document.getElementById("packages-upload-index"),
            {
              callbacks: {
                onSuccess: upload => {
                  $("#btn_package_add").prop('disabled', false);
                }
              }
            }
          );
        }
      });
    });

    // UPLOAD SYMBOLS FORM
    $(document).on('click', '#upload-symbols', function () {
      $.ajax({
        url: "{% url 'website:upload_symbols' %}",
        method: 'get',
        dataType: 'json',
        beforeSend: function () {
          $("#modal-update .modal-dialog").removeClass('modal-xl');
          $("#orochi-modal-content").html('');
          document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex');
        },
        success: function (data) {
          $("#orochi-modal-content").html(data.html_form);
          $("#btn_symbol_add").prop('disabled', true);
          initUploadFields(
            document.getElementById("symbols-upload-index"),
            {
              callbacks: {
                onSuccess: upload => {
                  $("#btn_symbol_add").prop('disabled', false);
                }
              }
            }
          );
        }
      });
    });

    // UPLOAD SYMBOLS FORM SUBMIT
    $(document).on("submit", "#symbols-upload-index", function (e) {
      e.preventDefault();
      var form = $(this);
      var formData = new FormData(this);
      let jsonData = form.serializeArray();
      let obj = { 'info': [] };
      jsonData.forEach(item => {
        if (['csrfmiddlewaretoken', 'symbols-uploads', 'upload_url', 'form_id', 'symbols-metadata'].indexOf(item.name) == -1) {
          obj[item.name] = item.value;
        } else if (item.name == 'symbols-uploads') {
          obj['info'].push({
            'local_folder': '/media/tmp/' + JSON.parse(item.value)[0]['id'],
            'original_name': JSON.parse(item.value)[0]['name'],
          });
        }
      });
      formData.append("payload", JSON.stringify(obj));
      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });
      $.ajax({
        url: form.attr("action"),
        data: formData,
        type: form.attr("method"),
        processData: false,
        contentType: false,
        dataType: 'json',
        success: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          table.ajax.reload();
          toast({
            title: 'Symbols added!',
            content: 'Symbols added.',
            type: 'success'
          });
        },
        error: function () {
          toast({
            title: 'Error!',
            content: 'Error during symbols upload.',
            type: 'error'
          });
        },
      });
    });

    $(document).on("submit", "#isf-download-index, #packages-upload-index", function (e) {
      e.preventDefault();
      $("#btn_isf_download").html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="sr-only">Loading...</span>');
      $("#btn_isf_download").prop('disabled', true);
      var form = $(this);
      var formData = new FormData(this);
      let jsonData = form.serializeArray();
      let obj = { 'info': [] };
      jsonData.forEach(item => {
        if (['csrfmiddlewaretoken', 'packages-uploads', 'upload_url', 'form_id', 'packages-metadata'].indexOf(item.name) == -1) {
          obj[item.name] = item.value;
        } else if (item.name == 'packages-uploads') {
          obj['info'].push({
            'local_folder': '/media/tmp/' + JSON.parse(item.value)[0]['id'],
            'original_name': JSON.parse(item.value)[0]['name'],
          });
        }
      });
      formData.append("payload", JSON.stringify(obj));
      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });

      $("#create_loading").show();
      $("#btn_package_add").prop('disabled', true);
      $("#btn_symbol_add").prop('disabled', true);
      $.ajax({
        url: form.attr("action"),
        data: formData,
        contentType: "application/json",
        type: form.attr("method"),
        processData: false,
        contentType: false,
        dataType: 'json',
        success: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          table.ajax.reload();
          toast({
            title: 'Symbols added!',
            content: data.message,
            type: 'success'
          });
        },
        error: function (data) {
          document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
          toast({
            title: 'Error!',
            content: data.responseJSON.errors,
            type: 'error'
          });
        },
      });
    });

    // DELETE SYMBOL
    $(document).on("click", ".symbol-delete", function () {
      var btn = $(this);
      var path = btn.data("path");

      $.ajaxSetup({
        headers: { 'X-CSRFToken': $('input[name="csrfmiddlewaretoken"]').val() }
      });

      $.ajax({
        url: "{% url 'api:delete_symbol' %}?path=" + encodeURIComponent(path),
        method: 'delete',
        dataType: 'json',
        success: function (data) {
          table.ajax.reload();
          toast({
            title: 'Symbols deleted!',
            content: data.message,
            type: 'success'
          });
        },
        error: function (data) {
          toast({
            title: 'Error!',
            content: data.responseJSON.errors,
            type: 'error'
          });
        },
      });
    });

  });
</script>
{% endblock javascript %}
