<script type="text/javascript">
  $(document).ready(function () {
    // Cache frequently used selectors
    const $modal = $("#modal-update");
    const $modalContent = $modal.find(".modal-content");
    const $indexList = $("#index-list");
    const $listPlugin = $("#list_plugin");

    // Use const for variables that don't change

    // RESTORE INDEXES AND PLUGIN IF BOOKMARKS
    window.selectedIndexes = {{ selected_indexes| safe }};
    window.selectedPlugin = {% if not selected_plugin %}null{% else %}"{{selected_plugin}}"{% endif %};
    window.selectedQuery = {% if not selected_query %}null{% else %}"{{selected_query}}"{% endif %};

    function syncDumpVisuals() {
      $('.dump_container').each(function () {
        const $container = $(this);
        const isChecked = $container.find(':checkbox').is(':checked');
        $container.toggleClass('is-selected', isChecked);
        const $colorBox = $container.find('.color_box');
        const color = $container.data('color') || $container.css('--dump-color') || '#3b82f6';
        if (isChecked) {
          $colorBox.css('background-color', color);
          $container.find('.check_icon').css('opacity', '1');
        } else {
          $colorBox.css('background-color', 'transparent');
          $container.find('.check_icon').css('opacity', '0');
        }
      });
    }

    function renderEmptyStage() {
      const tmpl = document.getElementById('tmpl_empty_stage');
      if (tmpl) {
        $('#main_stage').html(tmpl.innerHTML);
        if (window.selectedIndexes && window.selectedIndexes.length > 0) {
          $('#step_dump').addClass('border-blue-300 dark:border-blue-700 bg-blue-50/40 dark:bg-blue-950/20');
          $('#step_dump .step-badge').removeClass('hidden').html('<i class="fas fa-check text-blue-600 dark:text-blue-400"></i> Done');
          $('#step_plugin').addClass('ring-2 ring-emerald-500/40 border-emerald-300 dark:border-emerald-700 bg-emerald-50/40 dark:bg-emerald-950/20 animate-pulse');
          if (window.selectedIndexes.length === 2) {
            var $selectedDumps = $('.dump_container').filter(function () {
              return window.selectedIndexes.indexOf($(this).data('index')) > -1;
            });
            var host1 = ($selectedDumps.eq(0).data('host') || "").toString().trim();
            var host2 = ($selectedDumps.eq(1).data('host') || "").toString().trim();
            var isSameHost = Boolean(host1 && host2 && host1 === host2);

            if (isSameHost) {
              $('#main_stage').prepend(`
                <div id="temporal_diff_banner" class="mb-4 p-3.5 rounded-xl bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800/60 flex items-center justify-between gap-3 shadow-2xs">
                  <div class="flex items-center gap-2.5 text-xs text-indigo-900 dark:text-indigo-200">
                    <i class="fas fa-clock-rotate-left text-indigo-600 dark:text-indigo-400 text-sm"></i>
                    <span><strong>2 Dumps Selected (Host: ${host1}):</strong> Inspect chronological changes (processes, injected code, network) with <strong>Temporal Diff</strong>.</span>
                  </div>
                  <a href="/temporal_diff/${window.selectedIndexes[0]}/${window.selectedIndexes[1]}/" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white transition shadow-2xs shrink-0">
                    <i class="fas fa-timeline"></i> Open Temporal Diff
                  </a>
                </div>
              `);
            }
          }
        }
      }
    }
    window.renderEmptyStage = renderEmptyStage;

    function deselectCase() {
      $('#case-list .case-item').removeClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
      window.history.pushState({selectedPlugin: null, selectedIndexes: window.selectedIndexes || []}, "", "/");
      renderEmptyStage();
      if (window.selectedIndexes && window.selectedIndexes.length > 0 && window.selectedPlugin) {
        updateMainStage();
      }
    }
    window.deselectCase = deselectCase;

    // TOGGLE / DESELECT CASE CLICK LISTENER
    $(document).on('click', '#case-list .case-item', function (e) {
      const $this = $(this);
      const caseId = String($this.data('case-id'));
      const activeCaseId = $('#case_detail_view').data('case-id');
      const isCurrentlyActive = $this.hasClass('active') || (activeCaseId && String(activeCaseId) === caseId);

      if (isCurrentlyActive) {
        e.preventDefault();
        e.stopImmediatePropagation();
        deselectCase();
        return false;
      }
    });

    window.onpopstate = (event) => {
      const path = window.location.pathname;
      if (path === '/' || path === '') {
        $('#case-list .case-item').removeClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
        if (!window.selectedPlugin || !window.selectedIndexes || window.selectedIndexes.length === 0) {
          renderEmptyStage();
        }
      } else if (path.startsWith('/case/')) {
        const parts = path.split('/').filter(Boolean);
        const caseId = parts[1];
        if (caseId) {
          $('#case-list .case-item').removeClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
          $(`#case-list .case-item[data-case-id="${caseId}"]`).addClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
        }
      }

      if (event && event.state) {
        window.selectedPlugin = event.state.selectedPlugin;
        window.selectedIndexes = event.state.selectedIndexes || [];
        $(".dump_container :checkbox").each(function () {
          const idx = $(this).closest('.dump_container').data('index');
          $(this).prop('checked', window.selectedIndexes.includes(idx));
        });
        syncDumpVisuals();
        update_sidebar();
      }
    };

    // HTMX custom events
    document.body.addEventListener('showMessage', function(evt) {
       toast(evt.detail);
    });
    document.body.addEventListener('closeModal', function(evt) {
       document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex');
    });
    document.body.addEventListener('refreshCases', function(evt) {
       window.location.reload();
    });
    document.body.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'main_stage') {
        const caseView = document.getElementById('case_detail_view');
        if (caseView) {
          window.selectedPlugin = null;
          $('#list_plugin input[type=radio]').prop('checked', false);
          const activeCaseId = String($(caseView).data('case-id') || '');
          $('#case-list .case-item').removeClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
          if (activeCaseId) {
            $(`#case-list .case-item[data-case-id="${activeCaseId}"]`).addClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
          }
        }
      }
    });
    document.body.addEventListener('htmx:targetError', function(evt) {
        if (evt.detail.target === '#orochi-modal-content' && evt.detail.elt.tagName === 'FORM') {
            evt.preventDefault();
        } else {
            console.error("HTMX targetError detail:", evt.detail);
        }
    });
    document.body.addEventListener('htmx:responseError', function(evt) {
        if (evt.detail.xhr.status === 404 && evt.detail.requestConfig.path.includes('/info')) {
            const target = evt.detail.target;
            target.innerHTML = `
            <div class="p-8 text-center">
                <i class="fas fa-cog fa-spin fa-3x text-zinc-500 dark:text-zinc-400 mb-4"></i>
                <h4 class="text-xl font-bold text-zinc-900 dark:text-white mb-2">Processing Dump...</h4>
                <p class="text-zinc-500 dark:text-zinc-400">The dump information is currently being processed. Please wait a moment and try again.</p>
            </div>
            <div class="p-6 border-t border-zinc-300 dark:border-zinc-600 flex justify-end">
                <button type="button" class="px-5 py-2.5 text-sm font-medium text-zinc-900 dark:text-white bg-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-600 rounded-lg transition-colors" onclick="document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex')">Close</button>
            </div>
            `;
        }
    });

    if (window.location.hash && window.location.hash.startsWith('#dump_')) {
      const hashIdx = window.location.hash.slice('#dump_'.length).trim();
      if (hashIdx && !window.selectedIndexes.includes(hashIdx)) {
        window.selectedIndexes.push(hashIdx);
      }
    }

    if (window.selectedIndexes && window.selectedIndexes.length > 0) {
      window.selectedIndexes.forEach(element => {
        var container = $('#index-list .dump_container').filter('[data-index="' + element + '"]');
        if (container.length == 1) {
          var checkbox = $(":checkbox", container);
          checkbox.prop('checked', true);
        }
      });
      syncDumpVisuals();
      update_sidebar();
    } else {
      syncDumpVisuals();
    }

    const initialCaseId = $('#case_detail_view').data('case-id');
    if (initialCaseId) {
      $(`#case-list .case-item[data-case-id="${initialCaseId}"]`).addClass('active bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200 dark:border-purple-800/60 font-semibold');
    }



    // HIDE/SHOW NOTE PANEL
    $(document).on("shown.bs.offcanvas", "#leftNote", function () {
      $("#toggle_note").removeClass('btn-outline-danger');
    });

    // WS, UPDATE NOTE
    // Notification kinds sent by orochi.website.notifier: icon, colour and title of toasts and History Log entries
    const NOTIFY_KINDS = {
      dump: { icon: "fa-database", color: "text-blue-500", title: "Dump" },
      plugin: { icon: "fa-puzzle-piece", color: "text-emerald-500", title: "Plugin" },
      task: { icon: "fa-gears", color: "text-indigo-500", title: "Task" },
      symbols: { icon: "fa-shapes", color: "text-amber-500", title: "Symbols" },
      playbook: { icon: "fa-wand-magic-sparkles", color: "text-purple-500", title: "Playbook" },
      finding: { icon: "fa-triangle-exclamation", color: "text-rose-500", title: "Finding" },
      info: { icon: "fa-circle-info", color: "text-zinc-400", title: "Notification" },
    };
    window.NOTIFY_KINDS = NOTIFY_KINDS;

    var ws_scheme = window.location.protocol == "https:" ? "wss" : "ws";
    const chatSocket = new WebSocket(`${ws_scheme}://${window.location.host}/ws/notify/{{ user.pk }}/`);
    chatSocket.onmessage = function (e) {
      const data = JSON.parse(e.data);
      const text = data.message.split("||")[1];
      const date = data.message.split("||")[0];
      const kind = NOTIFY_KINDS[data.kind] || NOTIFY_KINDS.info;
      $("#activity_unread_dot").removeClass('hidden');
      $("#tab_history_badge").removeClass('hidden');
      const chatLogHtml = `
        <li class="p-3 bg-zinc-50 dark:bg-zinc-700/40 rounded-xl border border-zinc-200 dark:border-zinc-700/80">
          <dl>
            <dt class="text-[11px] font-medium text-zinc-400 dark:text-zinc-400 mb-1 flex items-center gap-1.5">
              <i class="fas ${kind.icon} ${kind.color}" aria-hidden="true"></i>
              <span class="font-semibold text-zinc-500 dark:text-zinc-300">${kind.title}</span>
              <span>&middot;</span> ${date}
            </dt>
            <dd class="text-sm text-zinc-700 dark:text-zinc-200 leading-relaxed">${text}</dd>
          </dl>
        </li>`;
      $("#chat-log").prepend(chatLogHtml);
      toast({
        title: kind.title,
        content: text,
        date: date,
        type: 'info'
      });
    };

    chatSocket.onclose = function (e) {
      console.error('Chat socket closed unexpectedly');
      console.error(e);
    };

    // TOGGLE HOST GROUP IN SIDEBAR
    window.toggleHostGroup = function (headerEl) {
      const $group = $(headerEl).closest('.host-group');
      const $dumps = $group.find('> .host-dumps');
      const $caret = $(headerEl).find('.host-caret');
      $dumps.slideToggle(150);
      $caret.toggleClass('-rotate-90');
    };

    // FILTER DUMP LIST
    $(document).on("keyup", "#filter_dump", function () {
      var value = $(this).val().toLowerCase().trim();
      if (!value) {
        $(".nested-list li, .host-group, .host-dumps").show();
        return;
      }

      $(".nested-list .dump_container").each(function () {
        var $dumpItem = $(this).closest("li");
        var text = $(this).text().toLowerCase();
        $dumpItem.toggle(text.indexOf(value) > -1);
      });

      $(".host-group").each(function () {
        var $group = $(this);
        var hostName = ($group.data("host") || "").toString().toLowerCase();
        if (hostName.indexOf(value) > -1) {
          $group.show();
          $group.find(".host-dumps").show();
          $group.find(".host-dumps li").show();
        } else {
          var visibleChildren = $group.find(".host-dumps li:visible").length;
          if (visibleChildren > 0) {
            $group.show();
            $group.find(".host-dumps").show();
          } else {
            $group.hide();
          }
        }
      });
    });

    // FILTER PLUGIN LIST
    $(document).on("keyup", "#filter_plugin", function () {
      var value = $(this).val().toLowerCase();
      $("#list_plugin li").filter(function () {
        $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
      });
    });

    // VT INFO DIALOG
    $(document).on("click", ".vt-info", function (e) {
      var btn = $(this);
      var path = btn.data('path');
      $.ajax({
        url: "{% url 'api:vt' %}",
        data: { 'path': path },
        dataType: 'json',
        method: 'get',
        beforeSend: function () {
          $("#orochi-modal-content").html('');
          openOrochiModal('max-w-7xl');
        },
        success: function (data) {
          const el = document.createElement('orochi-json-modal');
          el.data = { title: 'VirusTotal Report', data: data };
          $("#orochi-modal-content").empty().append(el);
        },
        error: function (data) {
          const el = document.createElement('orochi-json-modal');
          el.data = { title: 'VirusTotal Report', data: data.responseJSON };
          $("#orochi-modal-content").empty().append(el);
        }
      });
    });

    // MAXMIND INFO
    $(document).on("click", ".maxmind-info", function () {
      var btn = $(this);
      var ip = btn.data('ip');
      $.ajax({
        url: "{% url 'api:maxmind' %}",
        data: { 'ip': ip },
        dataType: 'json',
        method: 'get',
        beforeSend: function () {
          $("#orochi-modal-content").html('');
          openOrochiModal('max-w-7xl');
        },
        success: function (data) {
          const el = document.createElement('orochi-json-modal');
          el.data = { title: 'Maxmind Report', data: data };
          $("#orochi-modal-content").empty().append(el);
        },
        error: function (data) {
          const el = document.createElement('orochi-json-modal');
          el.data = { title: 'Maxmind Report', data: data.responseJSON };
          $("#orochi-modal-content").empty().append(el);
        }
      });
    });

    // UPDATE MAIN PAGE AFTER SELECTING PLUGIN
    function updateMainStage() {
      const $stage = $('#main_stage');
      const isCaseDetailActive = $('#case_detail_view').length > 0;

      if (window.selectedPlugin == null || window.selectedIndexes.length == 0) {
        if (!isCaseDetailActive) {
          window.history.pushState({selectedPlugin: null, selectedIndexes: null}, "", "/");
          renderEmptyStage();
        }
        return;
      }

      window.history.pushState(
        {selectedPlugin: window.selectedPlugin, selectedIndexes: window.selectedIndexes},
        "",
        `/indexes/${window.selectedIndexes.join(",")}/plugin/${window.selectedPlugin}`
      );

      $.get("{% url 'website:analysis' %}", { indexes: window.selectedIndexes, plugin: window.selectedPlugin })
        .done(function (data) {
          $stage.html(data);
          if ($stage && $stage.length && $stage[0] && typeof htmx !== 'undefined') {
            htmx.process($stage[0]); // Re-initialize HTMX on dynamically loaded content
          }
          if (typeof initAccordions === 'function') { initAccordions(); }

          const columns = $("#example tr th").map(function() { return $(this).text(); }).get();
          if (columns.length > 0) {initializeDataTable(columns);}

          // MANAGE AUTOREFRESH
          const running = $(".is-running").length;
          const autorefresh = localStorage.getItem("autorefresh") === "true";
          if (running > 0 && autorefresh) {setTimeout(updateMainStage, 5000);}
        })
        .fail(function () {
          renderEmptyStage();
          toast({
            title: 'Plugin results!',
            content: 'Error showing plugin results.',
            type: 'error'
          });
        });
    }

    // INITIALIZE DATATABLE
    function initializeDataTable(columns) {
      const notFilter = ["orochi_color", "__children", "actions", "Loading", "Empty", "Disabled", "Not started"];
      const pluginLower = String(window.selectedPlugin || "").toLowerCase();
      const escapeHtmlCell = (v) => String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      const extraColumnDefs = [];
      columns.forEach(function (colName, idx) {
        if (pluginLower.includes("ldrmodules") && ["InLoad", "InInit", "InMem"].includes(colName)) {
          extraColumnDefs.push({
            targets: idx,
            render: function (data, type) {
              if (type !== "display") return data;
              const val = String(data ?? "").trim().toLowerCase();
              if (val === "true") {
                return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">True</span>';
              }
              if (val === "false") {
                return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-50 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60">False</span>';
              }
              return escapeHtmlCell(data);
            }
          });
        } else if (pluginLower.includes("svcscan") && colName === "State") {
          extraColumnDefs.push({
            targets: idx,
            render: function (data, type) {
              if (type !== "display") return data;
              const raw = String(data ?? "").trim();
              const upper = raw.toUpperCase();
              if (upper.includes("RUNNING")) {
                return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">' + escapeHtmlCell(raw) + '</span>';
              }
              if (upper.includes("STOPPED")) {
                return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-medium bg-zinc-100 text-zinc-600 dark:bg-zinc-700/60 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-600">' + escapeHtmlCell(raw) + '</span>';
              }
              return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60">' + escapeHtmlCell(raw) + '</span>';
            }
          });
        } else if (pluginLower.includes("envars") && colName === "Variable") {
          extraColumnDefs.push({
            targets: idx,
            render: function (data, type) {
              if (type !== "display") return data;
              const raw = String(data ?? "").trim();
              if (/(KEY|TOKEN|SECRET|PASS|AUTH|CRED|API|AWS_|PRIVATE)/i.test(raw)) {
                return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-mono font-bold bg-amber-50 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60"><i class="fa-solid fa-key text-[9px]"></i>' + escapeHtmlCell(raw) + '</span>';
              }
              return escapeHtmlCell(data);
            }
          });
        } else if (colName === "PID" || colName === "PPID") {
          extraColumnDefs.push({
            targets: idx,
            render: function (data, type) {
              if (type !== "display" || data === null || data === undefined || data === "") return data;
              const rawPid = String(data).trim();
              const singleDump = (window.selectedIndexes && window.selectedIndexes.length === 1) ? window.selectedIndexes[0] : "";
              if (singleDump && /^\d+$/.test(rawPid) && parseInt(rawPid, 10) > 0) {
                return '<button type="button" onclick="window.openProcessDossierModal(\'' + escapeHtmlCell(singleDump) + '\', ' + parseInt(rawPid, 10) + ')" class="inline-flex items-center gap-1 font-mono text-[11px] font-semibold px-1.5 py-0.5 rounded bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/50 dark:hover:bg-blue-900/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800/60 transition cursor-pointer" title="Open Process 360° Dossier (PID ' + escapeHtmlCell(rawPid) + ')"><i class="fa-solid fa-address-card text-[9px]"></i><span>' + escapeHtmlCell(rawPid) + '</span></button>';
              }
              return '<span class="font-mono text-[11px] font-semibold px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-700/60 text-zinc-800 dark:text-zinc-200">' + escapeHtmlCell(data) + '</span>';
            }
          });
        }
      });

      window.openProcessDossierModal = function (dumpIndex, pid) {
        if (!dumpIndex || !pid) return;
        const modal = document.getElementById("modal-update");
        const content = document.getElementById("orochi-modal-content");
        const url = `/dump/${encodeURIComponent(dumpIndex)}/process/${encodeURIComponent(pid)}/dossier?modal=1`;
        if (!modal || !content) {
          window.open(`/dump/${encodeURIComponent(dumpIndex)}/process/${encodeURIComponent(pid)}/dossier`, "_blank");
          return;
        }
        if (typeof htmx !== "undefined") {
          htmx.ajax("GET", url, { target: "#orochi-modal-content", swap: "innerHTML" }).then(function () {
            modal.classList.remove("hidden");
            modal.classList.add("flex");
          });
        } else {
          $.get(url, function (html) {
            content.innerHTML = html;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
          });
        }
      };

      const triggerServerExport = function (fmt, dt) {
        const params = new URLSearchParams();
        const indexes = window.selectedIndexes || selectedIndexes || [];
        indexes.forEach(function (idx) { params.append('indexes[]', idx); });
        params.append('plugin', selectedPlugin || '');
        params.append('format', fmt);
        const searchQuery = dt && typeof dt.search === 'function' ? dt.search() : '';
        if (searchQuery) {
          params.append('search', searchQuery);
        }
        window.location.href = "{% url 'website:export_plugin_result' %}?" + params.toString();
      };

      const table = $("#example").DataTable({
        dom: '<"flex flex-wrap items-center justify-between gap-4 mb-4"<"flex flex-wrap items-center gap-3"lB><"flex items-center gap-3"f>>rt<"flex flex-wrap items-center justify-between gap-4 mt-4 pt-3 border-t border-zinc-100 dark:border-zinc-700/50"<"text-xs font-medium text-zinc-500 dark:text-zinc-400"i><"pagination-wrapper"p>>',
        buttons: [
          {
            text: '<i class="fa-solid fa-file-csv text-emerald-600 dark:text-emerald-400 mr-1.5"></i>CSV',
            className: 'dt-btn-export dt-btn-csv',
            titleAttr: 'Export all rows to CSV',
            action: function (e, dt) { triggerServerExport('csv', dt); }
          },
          {
            text: '<i class="fa-solid fa-file-excel text-emerald-700 dark:text-emerald-400 mr-1.5"></i>Excel',
            className: 'dt-btn-export dt-btn-excel',
            titleAttr: 'Export all rows to Excel (XLSX)',

      req.responseType = "blob";
      req.onload = function (event) {
        var blob = req.response;
        var cd = req.getResponseHeader('content-disposition') || '';
        var match = cd.match(/filename="?([^";]+)"?/i);
        var fallbackName = (btn.data('path') || 'download').split('/').pop() || 'download';
        var fileName = match ? match[1] : fallbackName;
        var blobUrl = window.URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        link.click();
        setTimeout(() => window.URL.revokeObjectURL(blobUrl), 1000);
      };
      req.send();
    });

        confirmButtonText: 'Yes, export it!'
      }).then((result) => {
        if (result.isConfirmed) {
          $.ajax({
            url: "{% url 'website:export'%}",
            type: 'get',
            data: {
              'path': btn.data('path'),
              'dump': btn.data('dump'),
              'plugin': btn.data('plugin')
            },
            dataType: 'json',
            success: function (data) {
              toast({
                title: 'MISP Export!',
                content: data.message || 'Export completed successfully.',
                type: 'success'
              });
            },
            error: function (data) {
              const errMsg = (data.responseJSON && (data.responseJSON.detail || data.responseJSON.message || data.responseJSON.errors)) || 'MISP export failed.';
              toast({
                title: 'MISP Export!',
                content: errMsg,
                type: 'error'
              });
            },
          });
        }
      });
    });
  });
</script>
