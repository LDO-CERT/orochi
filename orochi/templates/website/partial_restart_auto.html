<div class="flex items-center justify-between p-4 md:p-5 border-b border-zinc-200 dark:border-zinc-700">
    <h3 class="text-base font-bold text-zinc-900 dark:text-white flex items-center gap-2">
        <i class="fas fa-arrows-rotate text-blue-500"></i> Restart Auto Plugins
    </h3>
    <button type="button" class="text-zinc-400 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-700 dark:hover:text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center hex-close transition-colors cursor-pointer" onclick="document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex')">
        <i class="fas fa-times"></i>
        <span class="sr-only">Close modal</span>
    </button>
</div>
<div class="p-4 md:p-5">
    <p class="text-xs text-zinc-600 dark:text-zinc-300 mb-3">The following plugins are configured to run automatically for this dump's operating system (<strong>{{ dump.operating_system }}</strong>):</p>
    <ul class="space-y-2 mb-4 max-h-56 overflow-y-auto">
        {% for up in plugins %}
        <li class="flex items-center p-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-700/40 border border-zinc-200 dark:border-zinc-700 text-xs text-zinc-800 dark:text-zinc-200">
            <i class="fas fa-plug text-blue-500 mr-2.5"></i>
            <span class="font-semibold">{{ up.plugin.name }}</span>
        </li>
        {% endfor %}
    </ul>

    <div class="flex items-center mb-5">
        <input type="checkbox" id="restart_failed" name="restart_failed" class="w-4 h-4 text-blue-600 bg-white dark:bg-zinc-700 border-zinc-300 dark:border-zinc-600 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer">
        <label for="restart_failed" class="ms-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 cursor-pointer">Also restart all failed plugins</label>
    </div>

    <div class="flex justify-end gap-2 pt-3 border-t border-zinc-200 dark:border-zinc-700">
        <button type="button" class="py-2 px-4 text-xs font-medium text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-all shadow-sm cursor-pointer" onclick="document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex')">
            Cancel
        </button>
        <button type="button" class="py-2 px-4 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-500/20 rounded-lg shadow-sm transition-all cursor-pointer inline-flex items-center gap-1.5"
                hx-post="{% url 'website:index_restart' %}?index={{ index }}"
                hx-swap="none"
                hx-include="#restart_failed"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
            <i class="fas fa-arrows-rotate"></i> Confirm Restart
        </button>
    </div>
</div>
