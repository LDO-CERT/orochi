<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-zinc-300 dark:border-zinc-600">
    <h3 class="text-xl font-semibold text-zinc-900 dark:text-white">Restart Auto Plugins</h3>
    <button type="button" class="text-zinc-600 dark:text-zinc-300 bg-transparent hover:bg-zinc-100 dark:hover:bg-zinc-600 hover:text-zinc-900 dark:hover:text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center hex-close" onclick="document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex')">
        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
        <span class="sr-only">Close modal</span>
    </button>
</div>
<div class="p-4 md:p-5">
    <p class="text-sm text-zinc-800 dark:text-zinc-200 mb-4">The following plugins are configured to run automatically for this dump's operating system (<strong>{{ dump.operating_system }}</strong>):</p>
    <ul class="space-y-2 mb-6 max-h-64 overflow-y-auto">
        {% for up in plugins %}
        <li class="flex items-center p-3 rounded-lg bg-zinc-50 border border-zinc-200 dark:bg-zinc-700 dark:border-zinc-600 border border-zinc-300 dark:border-zinc-600 text-zinc-900 dark:text-zinc-100">
            <i class="fas fa-plug text-zinc-600 dark:text-zinc-300 mr-3"></i>
            <div>
                <div class="font-medium">{{ up.plugin.name }}</div>
            </div>
        </li>
        {% endfor %}
    </ul>

    <div class="flex items-center mb-6">
        <input type="checkbox" id="restart_failed" name="restart_failed" class="w-4 h-4 text-blue-600 bg-zinc-100 border-zinc-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-zinc-800 focus:ring-2 dark:bg-zinc-700 dark:border-zinc-600">
        <label for="restart_failed" class="ms-2 text-sm font-medium text-zinc-900 dark:text-zinc-300">Also restart all failed plugins</label>
    </div>

    <div class="flex justify-end space-x-3">
        <button type="button" class="text-zinc-900 dark:text-white bg-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-600 focus:ring-4 focus:outline-none focus:ring-zinc-300 dark:focus:ring-zinc-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center" onclick="document.getElementById('modal-update').classList.add('hidden'); document.getElementById('modal-update').classList.remove('flex')">
            Cancel
        </button>
        <button type="button" class="text-zinc-900 dark:text-white bg-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-600 focus:ring-4 focus:outline-none focus:ring-zinc-300 dark:focus:ring-zinc-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
                hx-post="{% url 'website:index_restart' %}?index={{ index }}"
                hx-swap="none"
                hx-include="#restart_failed"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
            Confirm Restart
        </button>
    </div>
</div>
