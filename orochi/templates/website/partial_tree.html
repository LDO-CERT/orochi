{% load custom_tags %}
{% include "website/partial_note.html" %}

{% if not empty %}
<div class="grid-wrapper mb-4">
  <div id="demo-controls" class="hide-on-welcome flex items-center gap-2 mb-3">
    <button id="expand-all" class="p-1.5 text-xs text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700/60 border border-zinc-300 dark:border-zinc-600 rounded-lg shadow-2xs transition-colors cursor-pointer" title="Expand all">
      <i class="fas fa-plus"></i>
    </button>
    <button id="toggle-all" class="p-1.5 text-xs text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700/60 border border-zinc-300 dark:border-zinc-600 rounded-lg shadow-2xs transition-colors cursor-pointer" title="Collapse all">
      <i class="fas fa-minus"></i>
    </button>
    <div class="h-4 border-r border-zinc-200 dark:border-zinc-700 mx-1"></div>
    <div class="relative">
      <input id="filterQuery" type="search" placeholder="Filter nodes..." class="bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-600 text-zinc-900 dark:text-white text-xs rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 shadow-2xs" />
    </div>
    <button type="button" class="p-1.5 text-xs text-zinc-700 dark:text-zinc-200 bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700/60 border border-zinc-300 dark:border-zinc-600 rounded-lg shadow-2xs transition-colors cursor-pointer" id="filter-hide"
      title="Hide unmatched nodes">
      <i class="fas fa-filter"></i>
    </button>
  </div>

  <main class="view rounded-xl border border-zinc-200 dark:border-zinc-700 overflow-hidden shadow-2xs">
    <output id="parentPath" class="hide-on-welcome hidden"></output>
    <div id="demo-tree" class="wb-skeleton wb-initializing wb-no-select wb-alternate max-h-[600px] overflow-auto">
      <h1>{{plugin}}</h1>
      <p>Loading&hellip;</p>
    </div>
  </main>
</div>

<script>

  // selected indexes and plugin are available globally as window.selectedIndexes and window.selectedPlugin

  // main datatree
  demoTree = new mar10.Wunderbaum({
    id: "demo",
    adjustHeight: false,
    element: document.getElementById("demo-tree"),
    connectTopBreadcrumb: document.getElementById("parentPath"),
    navigationModeOption: "row",
    columnsResizable: true,
    filter: {
      connectInput: "input#filterQuery",
      autoExpand: true,
      mode: "dim",
    },
    iconMap: "fontawesome6",
    // grid need table list
    columns: [
      {% for col in columns %}
        {% if forloop.first %}
          { id: "*", title: "{{col}}" },
        {% elif forloop.last %}
          { id: "orochi_color", title: "{{col}}", width: "100px" },
        {% else %}
          { id: "{{col}}", title: "{{col}}" }, //, sortable: true },
        {% endif %}
      {% endfor %}
    ],
    buttonClick: function (e) {
      console.log(e.type, e);
      if (e.command === "sort") {
        e.tree.sortByProperty({ colId: e.info.colId, updateColInfo: true });
      }
      else if (e.command === "filter") {
        e.info.colDef.filterActive = !e.info.colDef.filterActive;
        tree.update("colStructure");
      }
    },
    init: (e) => {
      e.tree.setFocus();
    },
    load: function (e) {},
    source: $.get("{% url 'website:tree' %}", {
      indexes: window.selectedIndexes,
      plugin: window.selectedPlugin,
    }),
    // grid fetch other columns data
    render: function (e) {
      const node = e.node;
      const util = e.util;

      for (const col of Object.values(e.renderColInfosById)) {
        switch (col.id) {
          case "orochi_color":
            col.elem.innerHTML = node.data[col.id]? '<svg class="bd-placeholder-img rounded me-2" width="20" height="20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"focusable="false" role="img"><rect width="100%" height="100%" fill="' + node.data[col.id] + '"></rect></svg>' : '';
            break;
          default:
            col.elem.textContent = node.data[col.id];
            break;
        }
      }
    }
  });

  // expand - toggle button
  $(document).on("click", "#toggle-all", function () {
    const tree = mar10.Wunderbaum.getTree("demo");
    tree.expandAll(false);
  });
  $(document).on("click", "#expand-all", function () {
    const tree = mar10.Wunderbaum.getTree("demo");
    tree.expandAll(true);
  });
  // hide - dim
  $(document).on("click", "#filter-hide", function () {
    const tree = mar10.Wunderbaum.getTree("demo");
    const mode = tree.getOption("filter.mode");
    tree.setOption("filter.mode", mode === "hide" ? "dim" : "hide");
  });
</script>
{% else %}
<div id="data" class="demo p-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-center text-xs text-zinc-500 dark:text-zinc-400" style="width: 100%">
  No data to display.
</div>
{% endif %}
