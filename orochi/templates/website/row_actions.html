<div class="inline-flex items-center gap-1" role="group" aria-label="Row Actions">
    <button type="button"
            class="p-1.5 text-xs text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-950/40 hover:bg-purple-100 dark:hover:bg-purple-900/60 rounded-md border border-purple-200 dark:border-purple-800/60 transition-colors cursor-pointer"
            title="Add to Case"
            hx-get="{% url 'website:evidence_create' %}"
            hx-vals='{"dump": "{{ dump }}", "plugin": "{{ plugin }}", "result_row": "{{ result_row }}", "extracted_file": "{{ extracted_file|default_if_none:"" }}"}'
            hx-target="#orochi-modal-content" hx-swap="innerHTML"
            onclick="document.getElementById('modal-update').classList.remove('hidden'); document.getElementById('modal-update').classList.add('flex')">
        <i class="fas fa-briefcase"></i>
    </button>
    {% if down_path %}
    <a href="#" class="download_obj p-1.5 text-xs text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 hover:bg-blue-100 dark:hover:bg-blue-900/60 rounded-md border border-blue-200 dark:border-blue-800/60 transition-colors inline-block" data-path="{{down_path}}" title="Download extracted file">
        <i class="fas fa-file-arrow-down"></i>
    </a>
    {% endif %}
    {% if misp_configured %}
    <a href="#" class="misp_export p-1.5 text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 dark:hover:bg-amber-900/60 rounded-md border border-amber-200 dark:border-amber-800/60 transition-colors inline-block" data-path="{{down_path}}" title="MISP Export">
        <i class="fas fa-file-export"></i>
    </a>
    {% endif %}
    {% if regipy %}
    <a href="/json_view/{{down_path}}.regipy.json" target="_blank" class="p-1.5 text-xs text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 rounded-md border border-emerald-200 dark:border-emerald-800/60 transition-colors inline-block" title="Regipy Report">
        <i class="fas fa-file-lines"></i>
    </a>
    {% endif %}
    {% if vt %}
    <a href="#" class="vt-info p-1.5 text-xs text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 rounded-md border border-rose-200 dark:border-rose-800/60 transition-colors inline-block" data-path="{{down_path}}.vt.json" title="VirusTotal Report">
        <i class="fas fa-virus"></i>
    </a>
    {% endif %}
</div>
