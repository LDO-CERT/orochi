{% extends "base.html" %}
{% load custom_tags %}

{% block title %}Auto-Triage Playbooks - {{ dump.name }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <!-- Breadcrumb -->
    <nav class="flex items-center text-xs font-medium text-zinc-500 dark:text-zinc-400 gap-2 mb-2" aria-label="Breadcrumb">
        <a href="{% url 'website:index' %}" class="hover:text-blue-600 dark:hover:text-blue-400 flex items-center gap-1">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <i class="fa-solid fa-chevron-right text-[9px] text-zinc-400"></i>
        <a href="/#dump_{{ dump.index }}" class="hover:text-blue-600 dark:hover:text-blue-400 font-semibold text-zinc-700 dark:text-zinc-200">
            {{ dump.name }}
        </a>
        <i class="fa-solid fa-chevron-right text-[9px] text-zinc-400"></i>
        <span class="text-zinc-900 dark:text-zinc-100 font-bold">Auto-Triage Playbooks</span>
    </nav>

    <div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-800 overflow-hidden">
        {% include "website/partial_dump_playbook.html" with is_standalone=True %}
    </div>
</div>
{% endblock %}
