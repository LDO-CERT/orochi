[project]
name = "orochi"
version = "2.7.0"
description = "Orochi - The Volatility Collaborative GUI"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "argon2-cffi==25.1.0",
    "beautifulsoup4==4.15.0",
    "bokeh==3.10.0",
    "capstone==5.0.9",
    "channels-redis==4.3.0",
    "channels[daphne]==4.3.2",
    "clamdpy==0.2.0",
    "cloudpickle==3.1.2",
    "crispy-bootstrap5==2026.9",
    "daphne==4.2.3",
    "dask==2026.8.0",
    "distributed==2026.8.0",
    "django==6.1.2",
    "django-admin-list-filter-dropdown==1.0.3",
    "django-admin-multiple-choice-list-filter==0.1.1",
    "django-allauth[mfa]==65.21.0",
    "django-auth-ldap==5.4.0",
    "django-colorfield==0.14.0",
    "django-cors-headers==4.9.0",
    "django-crispy-forms==2.7",
    "django-environ==0.14.0",
    "django-easy-audit==1.3.9",
    "django-extra-settings==0.15.0",
    "django-file-form==5.1.0",
    "django-guardian==3.5.2",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.8.1",
    "django-import-export==4.4.3",
    "django-json-widget==2.1.1",
    "django-ninja==1.7.1",
    "django-redis==7.0.0",
    "django-widget-tweaks==1.5.1",
    "docxtpl>=0.20.2",
    "geoip2==5.3.0",
    "gitpython==3.2.1",
    "gunicorn==26.2.0",
    "hiredis==3.5.0",
    "httpx>=0.28.1",
    "jsonschema==4.26.0",
    "jupyter-server-proxy>=4.5.0",
    "lz4==4.4.5",
    "marko==2.2.5",
    "msgpack==1.2.4",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pefile==2024.8.26",
    "pillow==13.0.0",
    "plotly==7.1.0",
    "psycopg2-binary==2.9.13",
    "pyarrow==26.0.0",
    "pycryptodome==3.23.0",
    "pymisp==2.5.34.4",
    "python-debian==1.1.1",
    "python-ldap==3.4.8",
    "python-magic==0.4.27",
    "pytz==2026.5",
    "redis==8.1.0",
    "regipy[full]==6.5.0",
    "rpmfile==2.2.1",
    "toolz==1.2.0",
    "tornado==6.5.8",
    "volatility3",
    "vt-py==0.22.0",
    "whitenoise==6.12.0",
    "yara-x==1.22.1",
    "markdown>=3.11.2",
    "stix2>=3.0.2",
    "weasyprint>=70.0",
]

[tool.uv.sources]
volatility3 = { git = "https://github.com/volatilityfoundation/volatility3.git", rev = "77ff0b1932d77527f850c8ced01d85805ea7bf97" }

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage==7.17.0",
    "django-coverage-plugin==3.2.2",
    "django-debug-toolbar==8.0.0",
    "django-extensions==4.1",
    "django-stubs==6.1.2",
    "factory-boy==3.3.3",
    "flake8==7.4.1",
    "flake8-isort==7.0.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pylint-django==2.8.0",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-sugar==1.1.1",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "docs",
    "node_modules",
    "migrations",
    ".git",
    ".tox",
    ".venv",
    "compose",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line length handled by ruff format
    "DJ001", # avoid removing null=True on existing model string fields
    "DJ008", # model does not define __str__ method
    "DJ012", # model inner classes / methods order
    "B008",  # function call in argument defaults (used by Django Ninja Query, File, etc.)
    "B904",  # raise ... from err in except clause
]

[tool.ruff.lint.isort]
known-first-party = ["config", "orochi"]
